<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Entertainment Hub</title>

  <style>
    body {
      margin: 0;
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background: #171725;
      padding: 25px;
    }

    button {
      background: #4b4bff;
      color: white;
      border: 0;
      padding: 12px 20px;
      margin: 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #6868ff;
    }

    .page {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #171725;
      padding: 25px;
      border-radius: 15px;
    }

    .emoji {
      font-size: 50px;
    }

    #game {
      display: none;
      margin-top: 30px;
      padding: 30px;
      background: #171725;
      border-radius: 20px;
    }

    #reactionBox {
      height: 250px;
      background: #33334a;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      cursor: pointer;
    }

    #movies {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 My Entertainment Hub</h1>

  <button onclick="gamesPage()">🎮 Games</button>
  <button onclick="moviesPage()">🍿 Movies</button>

  <a href="https://minecrafteaglercraft.gitlab.io/go/minecraft-1.5.2/" target="_blank">
  <button>⛏️ Play Minecraft</button>
</a>

</header>

<div class="page">

  <div id="home">
    <h2>Welcome 👋</h2>
    <p>Games, movies, and more!</p>
  </div>

  <div id="games">
    <h2>🎮 Games</h2>

    <div class="games">

      <div class="card">
        <div class="emoji">🖱️</div>
        <h2>Clicker</h2>
        <p id="clickScore">Clicks: 0</p>
        <button onclick="clickGame()">CLICK!</button>
      </div>

      <div class="card">
        <div class="emoji">🔢</div>
        <h2>Guess Number</h2>
        <button onclick="guessGame()">PLAY</button>
      </div>

      <div class="card">
        <div class="emoji">⚡</div>
        <h2>Reaction Test</h2>
        <button onclick="reactionGame()">PLAY</button>
      </div>

    </div>

    <div id="game">
      <h2>⚡ Reaction Test</h2>

      <p id="reactionText">Press START</p>

      <div id="reactionBox" onclick="reactionClick()">
        START
      </div>

      <p id="reactionResult"></p>
    </div>
  </div>

  <div id="movies">
    <h2>🍿 Movies</h2>
    <div class="card">
      <h2>🎬 Movie Zone</h2>
      <p>Movie section coming soon!</p>
    </div>
  </div>

</div>

<script>

let clicks = 0;

let reactionReady = false;
let reactionStart = 0;
let reactionTimer = null;

function gamesPage() {
  document.getElementById("home").style.display = "block";
  document.getElementById("games").style.display = "block";
  document.getElementById("movies").style.display = "none";
}

function moviesPage() {
  document.getElementById("home").style.display = "none";
  document.getElementById("games").style.display = "none";
  document.getElementById("movies").style.display = "block";
}

function clickGame() {
  clicks = clicks + 1;
  document.getElementById("clickScore").textContent =
    "Clicks: " + clicks;
}

function guessGame() {
  let number = Math.floor(Math.random() * 10) + 1;

  let guess = prompt("Guess a number from 1 to 10!");

  if (Number(guess) === number) {
    alert("🎉 YOU GOT IT!");
  } else {
    alert("❌ Nope! The number was " + number);
  }
}

function reactionGame() {

  document.getElementById("game").style.display = "block";

  let box = document.getElementById("reactionBox");

  box.style.background = "#9b2226";
  box.textContent = "🔴 WAIT...";

  document.getElementById("reactionText").textContent =
    "Wait for green!";

  document.getElementById("reactionResult").textContent = "";

  reactionReady = false;

  clearTimeout(reactionTimer);

  reactionTimer = setTimeout(function() {

    reactionReady = true;
    reactionStart = performance.now();

    box.style.background = "#168a3a";
    box.textContent = "🟢 CLICK!";

    document.getElementById("reactionText").textContent =
      "CLICK NOW!";

  }, Math.floor(Math.random() * 3000) + 1500);
}

function reactionClick() {

  let box = document.getElementById("reactionBox");

  if (!reactionReady) {

    if (box.textContent === "🔴 WAIT...") {

      clearTimeout(reactionTimer);

      box.style.background = "#9b2226";
      box.textContent = "❌ TOO EARLY!";

      document.getElementById("reactionText").textContent =
        "You clicked too early!";

      document.getElementById("reactionResult").textContent =
        "Press PLAY to try again.";

    }

    return;
  }

  let time = Math.round(performance.now() - reactionStart);

  reactionReady = false;

  box.style.background = "#33334a";
  box.textContent = time + " ms ⚡";

  document.getElementById("reactionText").textContent =
    "Nice!";

  document.getElementById("reactionResult").textContent =
    "Press PLAY to try again.";

}

</script>

</body>
</html>
