<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Entertainment Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #151522;
  padding: 25px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

nav {
  margin-top: 15px;
}

nav button {
  background: #292940;
  color: white;
  border: 0;
  padding: 12px 20px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

.hero {
  text-align: center;
  padding: 30px 0;
}

.hero h2 {
  font-size: 38px;
}

.search {
  width: 100%;
  max-width: 600px;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #151522;
  color: white;
  font-size: 16px;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: #151522;
  border: 1px solid #292940;
  border-radius: 15px;
  padding: 20px;
  text-align: center;
}

.emoji {
  font-size: 50px;
}

.card p {
  color: #aaa;
}

.play {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #4b4bff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.movie {
  background: #151522;
  border-radius: 15px;
  padding: 30px;
  text-align: center;
}

footer {
  text-align: center;
  color: #777;
  padding: 40px;
}
</style>
</head>

<body>

<header>
<h1>🎮 My Entertainment Hub</h1>

<nav>
<button onclick="showGames()">🎮 Games</button>
<button onclick="showMovies()">🍿 Movies</button>
</nav>
</header>

<div class="container">

<div class="hero">
<h2>Welcome 👋</h2>
<p>Games, movies, and more!</p>

<input
class="search"
id="search"
placeholder="🔎 Search games..."
oninput="searchGames()">
</div>

<section id="gamesSection">

<h2>🎮 Games</h2>

<div class="games" id="gameList">

<div class="card" data-name="Clicker Game">
<div class="emoji">🖱️</div>
<h3>Clicker Game</h3>
<p>Click as fast as you can!</p>
<button class="play" onclick="startClicker()">PLAY</button>
</div>

<div class="card" data-name="Guess The Number">
<div class="emoji">🔢</div>
<h3>Guess The Number</h3>
<p>Guess the secret number.</p>
<button class="play" onclick="guessNumber()">PLAY</button>
</div>

<div class="card" data-name="Reaction Test">
<div class="emoji">⚡</div>
<h3>Reaction Test</h3>
<p>Test your reaction speed.</p>
<button class="play" onclick="reactionTest()">PLAY</button>
</div>

</div>
</section>

<section id="moviesSection" style="display:none">

<h2>🍿 Movies</h2>

<div class="movie">
<h2>🎬 Movie Zone</h2>
<p>Movie section coming soon!</p>
</div>

</section>

</div>

<footer>
Made with ❤️
</footer>

<script>

function showGames() {
document.getElementById("gamesSection").style.display = "block";
document.getElementById("moviesSection").style.display = "none";
}

function showMovies() {
document.getElementById("gamesSection").style.display = "none";
document.getElementById("moviesSection").style.display = "block";
}

function searchGames() {

const search =
document.getElementById("search").value.toLowerCase();

const cards =
document.querySelectorAll(".card");

cards.forEach(card => {

const name =
card.dataset.name.toLowerCase();

card.style.display =
name.includes(search) ? "block" : "none";

});

}

function startClicker() {

let clicks = 0;

const game = window.open("", "_blank");

game.document.write(`
<html>
<head>
<title>Clicker Game</title>
<style>
body {
background:#0b0b12;
color:white;
font-family:Arial;
text-align:center;
padding-top:100px;
}
button {
font-size:30px;
padding:25px 50px;
border:0;
border-radius:15px;
}
</style>
</head>

<body>

<h1>🖱️ Clicker Game</h1>

<h2 id="score">Clicks: 0</h2>

<button id="click">CLICK!</button>

<script>
document.getElementById("click").onclick = function() {
clicks++;
document.getElementById("score").textContent =
"Clicks: " + clicks;
};
<\/script>

</body>
</html>
`);

game.document.close();

}

function guessNumber() {

const secret =
Math.floor(Math.random() * 10) + 1;

const answer =
prompt("Guess a number from 1 to 10!");

if (Number(answer) === secret) {
alert("🎉 You got it!");
} else {
alert("❌ Nope! The number was " + secret);
}

}
